<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Karib Shams - powered on by a generator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03110c"/><stop offset="1" stop-color="#062a1f"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset=".5" stop-color="#ECFDF5"/><stop offset="1" stop-color="#6EE7B7"/></linearGradient>
  <radialGradient id="room" cx="0.65" cy="0.5" r="0.6"><stop offset="0" stop-color="#10B981" stop-opacity=".45"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#10B981" stroke-opacity=".07"/></pattern>
</defs>
<rect width="960" height="260" rx="18" fill="url(#bg)"/>
<rect width="960" height="260" rx="18" fill="url(#grid)"/>
<rect width="960" height="260" rx="18" fill="url(#room)" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.1;1;0.3;1;1;1;0.4;0;0" keyTimes="0;0.10;0.14;0.17;0.20;0.23;0.26;0.30;0.85;0.90;0.95;1" dur="10s" repeatCount="indefinite"/></rect>

<!-- generator -->
<g>
  <rect x="30" y="78" width="120" height="112" rx="14" fill="#07231a" stroke="#10B981" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="90" cy="130" r="30" fill="none" stroke="#064e3b" stroke-width="5"/>
  <circle cx="90" cy="130" r="30" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-dasharray="40 149">
    <animateTransform attributeName="transform" type="rotate" from="0 90 130" to="360 90 130" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="130" r="20" fill="none" stroke="#6EE7B7" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="360 90 130" to="0 90 130" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M94 114 L82 133 H90 L86 148 L100 126 H92 Z" fill="#ECFDF5">
    <animate attributeName="opacity" values="1;.55;1" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="46" cy="94" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="94" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.2;1" dur="1s" begin=".33s" repeatCount="indefinite"/></circle>
  <circle cx="74" cy="94" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.2;1" dur="1s" begin=".66s" repeatCount="indefinite"/></circle>
  <text x="90" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6EE7B7" letter-spacing="3">GEN</text>
</g>

<!-- wire 1: generator -> switch (always live) -->
<path d="M150 134 H196" stroke="#064e3b" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M150 134 H196" stroke="#34D399" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 8">
  <animate attributeName="stroke-dashoffset" from="28" to="0" dur=".8s" repeatCount="indefinite"/>
</path>

<!-- toggle switch -->
<g>
  <rect x="196" y="112" width="84" height="44" rx="22" fill="#111c18" stroke="#10B981" stroke-opacity=".7" stroke-width="2">
    <animate attributeName="fill" values="#111c18;#111c18;#0f6b4d;#0f6b4d;#111c18;#111c18" keyTimes="0;0.09;0.11;0.90;0.92;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <circle cx="218" cy="134" r="16" fill="#ECFDF5">
    <animate attributeName="cx" values="218;218;258;258;218;218" keyTimes="0;0.09;0.11;0.90;0.92;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="238" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="3" fill="#6EE7B7">
    <animate attributeName="fill-opacity" values=".4;.4;1;1;.4;.4" keyTimes="0;0.09;0.11;0.90;0.92;1" dur="10s" repeatCount="indefinite"/>
    PWR
  </text>
</g>

<!-- wire 2: switch -> name (energised when ON) -->
<path d="M280 134 H326" stroke="#064e3b" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M280 134 H326" stroke="#6EE7B7" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 8" opacity="0">
  <animate attributeName="stroke-dashoffset" from="28" to="0" dur=".6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.11;0.90;0.92;1" dur="10s" repeatCount="indefinite"/>
</path>
<circle r="5" fill="#ECFDF5" opacity="0" filter="url(#soft)">
  <animateMotion path="M280 134 H326" dur="0.7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.11;0.90;0.92;1" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- unlit tube (always visible) -->
<text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" font-size="74" textLength="600" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#0b4d38" stroke-width="2">KARIB SHAMS</text>

<!-- glow halo -->
<text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" font-size="74" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#10B981" filter="url(#glow)" opacity="0">KARIB SHAMS<animate attributeName="opacity" values="0;0;0.9;0.1;1;0.3;1;1;1;0.4;0;0" keyTimes="0;0.10;0.14;0.17;0.20;0.23;0.26;0.30;0.85;0.90;0.95;1" dur="10s" repeatCount="indefinite"/></text>

<!-- lit name -->
<text x="330" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" font-size="74" textLength="600" lengthAdjust="spacingAndGlyphs" fill="url(#ink)" opacity="0">KARIB SHAMS<animate attributeName="opacity" values="0;0;0.9;0.1;1;0.3;1;1;1;0.4;0;0" keyTimes="0;0.10;0.14;0.17;0.20;0.23;0.26;0.30;0.85;0.90;0.95;1" dur="10s" repeatCount="indefinite"/></text>

<!-- subtitle -->
<text x="332" y="184" font-family="Consolas, monospace" font-size="15" fill="#A7F3D0" letter-spacing="4" textLength="596" opacity="0">AI ARCHITECT  ·  DATA SCIENTIST  ·  TEAM LEADER<animate attributeName="opacity" values="0;0;0;0.6;0.1;1;0.4;1;1;0.3;0;0" keyTimes="0;0.10;0.14;0.17;0.20;0.23;0.26;0.30;0.85;0.90;0.95;1" dur="10s" repeatCount="indefinite"/></text>
<rect x="332" y="200" width="596" height="3" rx="1.5" fill="#34D399" opacity="0" filter="url(#soft)"><animate attributeName="opacity" values="0;0;0;0.6;0.1;1;0.4;1;1;0.3;0;0" keyTimes="0;0.10;0.14;0.17;0.20;0.23;0.26;0.30;0.85;0.90;0.95;1" dur="10s" repeatCount="indefinite"/></rect>
</svg>